<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>nana mg1 配置编辑器</title><style>body{margin:0;background:#0c1423;color:#edf4fc;font:17px/1.6 system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:36px 24px}h1{font-size:32px}a{color:#9ee3ee}label{display:block;margin:18px 0 8px}input,textarea,button{font:inherit;border:1px solid #60728e;border-radius:8px;padding:12px;color:#edf4fc;background:#18263d}input[type=text]{width:70%}textarea{box-sizing:border-box;width:100%;height:430px;font:14px/1.6 monospace}button{background:#245e75;cursor:pointer;margin:14px 12px 0 0}#status{min-height:32px;color:#b2e3c4}nav{display:flex;gap:22px}</style><main><h1>nana mg1 配置编辑器</h1><p>修改标题、强调色或完整配置，再导出配置文件并重新构建。</p><nav><a href="README.md">使用说明</a><a href="预览/通用示例.mp4">查看示例视频</a></nav><label for="title">开场标题</label><input id="title" type="text"><label for="accent">强调色</label><input id="accent" type="color"><label for="config">完整配置</label><textarea id="config" spellcheck="false"></textarea><div><button id="apply">应用标题和颜色</button><button id="save">导出配置</button></div><p id="status">正在读取默认配置…</p></main><script>const box=document.querySelector('#config'),status=document.querySelector('#status'),title=document.querySelector('#title'),accent=document.querySelector('#accent');fetch('模板工程/配置.json').then(r=>r.json()).then(c=>{box.value=JSON.stringify(c,null,2);title.value=c.templates['01-title'].title;accent.value=c.accent;status.textContent='配置已载入。修改后导出配置文件。';}).catch(()=>{status.textContent='请通过本地HTTP服务打开本页，再读取默认配置。';});document.querySelector('#apply').onclick=()=>{try{const c=JSON.parse(box.value);c.templates['01-title'].title=title.value;c.accent=accent.value;box.value=JSON.stringify(c,null,2);status.textContent='标题和颜色已应用，可导出配置。';}catch(e){status.textContent='配置格式有误，请检查引号、逗号和括号。';}};document.querySelector('#save').onclick=()=>{try{const c=JSON.parse(box.value);const u=URL.createObjectURL(new Blob([JSON.stringify(c,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='配置.json';a.click();URL.revokeObjectURL(u);status.textContent='已导出配置。将文件放回模板工程，再运行构建命令。';}catch(e){status.textContent='配置格式有误，修正后再导出。';}};</script></html>
